name: Build and Deploy SSH TUI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ssh-tui/**'
      - 'assets/**'
      - 'blog_posts/**'
      - '.github/workflows/deploy-tui.yml'

jobs:
  build-and-deploy:
    # Self-hosted in the homelab cluster (one fresh pod per job, see
    # thatbagu/dotfiles homelab/apps/cv-runner.nix).
    runs-on: cv-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ssh-tui/go.mod
          cache-dependency-path: ssh-tui/go.sum

      - name: Build binary
        working-directory: ssh-tui
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o ../cv-tui .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx (the runner pod's BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ssh-tui/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cv-tui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cv-tui:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to cluster
        # kubectl uses the runner pod's ServiceAccount (restart cv/cv-tui only).
        run: |
          kubectl rollout restart deployment/cv-tui -n cv
          kubectl rollout status deployment/cv-tui -n cv --timeout=120s
