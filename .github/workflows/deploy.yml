name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    # Self-hosted in the homelab cluster (one fresh pod per job, see
    # thatbagu/dotfiles homelab/apps/cv-runner.nix).
    runs-on: cv-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pil python3-cairosvg python3-yaml python3-markdown

      - name: Generate OG images
        run: python3 .github/workflows/generate_og_images.py

      - name: Generate Atom feed
        run: python3 .github/workflows/generate_feeds.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx (the runner pod's BuildKit)
        uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/website:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/website:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to cluster
        # kubectl uses the runner pod's ServiceAccount (restart cv/cv-tui only).
        run: |
          kubectl rollout restart deployment/cv -n cv
          kubectl rollout status deployment/cv -n cv --timeout=120s
